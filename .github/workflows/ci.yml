name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false
      - name: Resolve dependencies
        run: go mod tidy
      - name: Show resolved module files
        run: |
          cat go.mod
          echo "--- go.sum ---"
          cat go.sum
      - name: Check formatting
        run: |
          unformatted="$(find cmd internal -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Smoke test inspect command
        run: go run ./cmd/oasrelay inspect ./testdata/customer-api.yaml
      - name: Check module files are tidy
        run: git diff --exit-code -- go.mod go.sum
